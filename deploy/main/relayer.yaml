# HA RelayMiner relayer for MainNet, image tag v0.1.6.
# Use a separate host or compose project from Beta. Do not share Redis.

listen_addr: "0.0.0.0:8080"

redis:
  url: "redis://redis:6379"

pocket_node:
  query_node_rpc_url: "https://sauron-rpc.infra.pocket.network"
  query_node_grpc_url: "sauron-grpc.infra.pocket.network:443"
  grpc_insecure: false

keys:
  keys_file: "/keys/supplier-keys.local.yaml"

services:
  relay-quote:
    validation_mode: eager
    timeout_profile: fast
    max_body_size_bytes: 1048576
    default_backend: rest
    backends:
      rest:
        url: "http://backend:8080"
        health_check:
          enabled: true
          endpoint: "/v1/health"
          method: "GET"
          expected_body: '"ok"'
          expected_status: [200]
          interval_seconds: 10
          timeout_seconds: 5
          unhealthy_threshold: 3
          healthy_threshold: 2

health_check:
  enabled: true
  addr: "0.0.0.0:8081"

metrics:
  enabled: true
  addr: "127.0.0.1:9090"

pprof:
  enabled: true
  addr: "127.0.0.1:6060"

logging:
  level: "info"
  format: "json"
