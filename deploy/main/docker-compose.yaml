# MainNet supplier stack. Keep it separate from deploy/beta.
# RelayMiner image: ghcr.io/pokt-network/pocket-relay-miner:v0.1.6
#
#   docker compose -p relay-quote-main up -d
#
# Loopback publish is port 8181 so it can run beside a Beta stack.
# Public traffic still goes through your own HTTPS hostname.

services:
  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: "8080"
      SERVICE_ID: relay-quote
      SERVICE_VERSION: "1.0.0"
    expose:
      - "8080"
    mem_limit: 256m
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  miner:
    image: ghcr.io/pokt-network/pocket-relay-miner:v0.1.6
    command: ["miner", "--config", "/config/miner.yaml"]
    volumes:
      - ./miner.yaml:/config/miner.yaml:ro
      - ./supplier-keys.local.yaml:/keys/supplier-keys.local.yaml:ro
    environment:
      GOMEMLIMIT: 3600MiB
      GOMAXPROCS: "2"
    mem_limit: 4g
    cpus: 2
    depends_on:
      redis:
        condition: service_healthy
    restart: on-failure

  relayer:
    image: ghcr.io/pokt-network/pocket-relay-miner:v0.1.6
    command: ["relayer", "--config", "/config/relayer.yaml"]
    volumes:
      - ./relayer.yaml:/config/relayer.yaml:ro
      - ./supplier-keys.local.yaml:/keys/supplier-keys.local.yaml:ro
    ports:
      - "127.0.0.1:8181:8080"
    environment:
      GOMEMLIMIT: 1800MiB
      GOMAXPROCS: "2"
    mem_limit: 2g
    cpus: 2
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  redis-data:
