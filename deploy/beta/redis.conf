# Starter Redis for the HA RelayMiner. Production sizing is in the
# pocket-relay-miner v0.1.0 capacity report. This file only keeps the rules
# that stop the miner from starting or from losing claims.
maxmemory 256mb
maxmemory-policy noeviction
save ""
save 900 1
appendonly no
rdbcompression yes
io-threads 1
tcp-keepalive 300
