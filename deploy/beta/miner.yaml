# HA RelayMiner miner for Beta TestNet. Chain id pocket-lego-testnet.
# Validate: pocket-relay-miner miner validate --config miner.yaml

redis:
  url: "redis://redis:6379"

pocket_node:
  query_node_rpc_url: "https://sauron-rpc.beta.infra.pocket.network"
  query_node_grpc_url: "sauron-grpc.beta.infra.pocket.network:443"
  chain_id: "pocket-lego-testnet"
  grpc_insecure: false

keys:
  keys_file: "/keys/supplier-keys.local.yaml"

block_time_seconds: 30

metrics:
  enabled: true
  addr: "127.0.0.1:9092"

logging:
  level: "info"
  format: "json"
